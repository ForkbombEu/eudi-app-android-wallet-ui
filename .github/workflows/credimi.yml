name: Credimi APK Tests rerun

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: credimi-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  credimi:
    name: Build APK and run Credimi test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK dependencies
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build demo debug APK
        run: ./gradlew --no-daemon :app:assembleDemoDebug

      - name: Run Credimi test
        uses: ForkbombEu/credimi-test-action@v1.1.0
        with:
          api-key: ${{ secrets.CREDIMI_API_KEY }}
          apk-file: app/build/outputs/apk/demo/debug/app-demo-debug.apk
          pipeline-ids: |
            forkbomb-bv-andrea/eudiw-2026-02-35-get-pid-sd-jwt-vc-issuer-backend
            forkbomb-bv-andrea/eudiw-2026-02-35-webuild-conformance-checks-5x
          runner-ids: |
            forkbomb-bv-andrea/raspi-android15-a1/redroid
            forkbomb-bv-andrea/pixel6-android16-a1/android_phone
